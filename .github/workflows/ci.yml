name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test errorbook generation
        run: |
          python -m errorbook -i examples/错题.csv --title 我的错题整理册 -o errorbook.html
          python -c 'from pathlib import Path; page = Path("errorbook.html").read_text(encoding="utf-8"); assert page.count("<article") == 5; assert page.count("复习打卡") == 5; assert "第 3 / 3 页" in page; assert "A4 portrait" in page'
