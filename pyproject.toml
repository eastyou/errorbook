[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "errorbook"
version = "0.1.0"
description = "错题 CSV 一键生成 A4 可打印、可复习打卡的错题整理册"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["errorbook", "student", "education", "print", "review", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
errorbook = "errorbook.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/errorbook"
Source = "https://github.com/eastyou/errorbook"

[tool.setuptools]
packages = ["errorbook"]
